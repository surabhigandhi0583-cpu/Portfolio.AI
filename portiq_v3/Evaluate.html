<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Evaluate Portfolio | Portfolio.AI </title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <style>
    body {
      font-family: "Poppins", sans-serif;
      margin: 0;
      overflow-x: hidden;
      background: #fff;
      color: #111;
    }
    .hero {
      background: url('https://wallpapercave.com/wp/wp2700093.jpg') no-repeat center/cover;
      background-size: cover;
      background-attachment: fixed;
      min-height: 50vh;
      position: relative;
      color: #111;
      padding: 100px 20px;
      text-align: center;
    }
    .hero::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255, 255, 255, 0.45);
    }
    .hero h1, .hero p { position: relative; color: #111 !important; }
    .hero p { opacity: 0.9; }
    .card {
      border: none;
      background: #fff;
      color: #111;
      box-shadow: 0 0 15px rgba(15, 23, 42, 0.08);
    }
    footer { background: #f8f9fa; color: #333; padding: 20px; text-align: center; border-top:1px solid #e9ecef; }
    .navbar-dark .navbar-nav .nav-link { color: rgba(33,37,41,.85); }
    .navbar-dark .navbar-nav .nav-link.active, .navbar-dark .navbar-nav .nav-link:hover { color: #0d6efd; }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top border-bottom">
    <div class="container">
      <a class="navbar-brand fw-bold" href="Index.html">Portfolio Evaluator</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="Index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="Evaluate.html">Evaluate</a></li>
          <li class="nav-item"><a class="nav-link" href="Results.html">Results</a></li>
          <li class="nav-item"><a class="nav-link" href="Dashboard.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="About.html">About</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Hero -->
  <section class="hero">
    <div class="container">
      <h1>Evaluate Your Portfolio</h1>
      <p>Submit your GitHub repos, LinkedIn, and resume for instant AI-powered insights.</p>
    </div>
  </section>

  <!-- Evaluation Form -->
  <section class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-10">
        <div class="card p-4">
          <form method="POST" action="/evaluate" enctype="multipart/form-data">
            <div class="mb-3">
              <label for="githubInput" class="form-label">GitHub Usernames or Repository URLs (one per line)</label>
              <textarea class="form-control" id="githubInput" name="githubInputs" rows="4"
                placeholder="Enter GitHub usernames or full repo URLs, one per line (e.g., username or https://github.com/username/repo)"></textarea>
            </div>
            <div class="mb-3">
              <label for="resumeFile" class="form-label">Resume PDF (optional)</label>
              <input type="file" class="form-control" id="resumeFile" name="resume_file" accept=".pdf">
              <div class="form-text">Upload a PDF resume file. Max 5MB.</div>
            </div>
            <div class="mb-3">
              <label for="linkedin" class="form-label">LinkedIn Profile (optional)</label>
              <input type="url" class="form-control" id="linkedin" name="linkedin"
                placeholder="https://linkedin.com/in/yourname">
            </div>
            <div class="mb-3">
              <label for="portfolioUrl" class="form-label">Portfolio Website URL (optional)</label>
              <input type="url" class="form-control" id="portfolioUrl" name="portfolio_url"
                placeholder="https://yourportfolio.com">
            </div>
            <button type="submit" class="btn btn-primary">Run Evaluation</button>
          </form>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 AI Portfolio Evaluator | Built with Flask & Bootstrap</p>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
